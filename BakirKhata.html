<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NID Agent Tool - GitHub Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #818cf8; --danger: #f43f5e; --bg-dark: #0f172a; --glass-bg: rgba(30, 41, 59, 0.7); --text-main: #f8fafc; --text-dim: #94a3b8; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .setup-box { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 24px; width: 100%; max-width: 420px; }
        h2 { font-size: 22px; text-align: center; margin-bottom: 25px; color: var(--primary); }
        #qr-container { background: white; padding: 10px; border-radius: 15px; margin: 0 auto 20px auto; display: none; justify-content: center; align-items: center; width: 140px; height: 140px; }
        #connection-status { text-align: center; font-size: 12px; margin-bottom: 15px; color: var(--text-dim); font-weight: bold; }
        .input-group { margin-bottom: 15px; }
        .upload-label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 8px; }
        .file-wrapper { position: relative; width: 100%; height: 50px; background: rgba(15, 23, 42, 0.5); border: 2px dashed #334155; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .file-wrapper input[type="file"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
        .placeholder-text { color: var(--text-dim); font-size: 13px; z-index: 2; }
        .btn-group { display: flex; gap: 12px; margin-top: 25px; }
        button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
        .btn-dl { background: #7c3aed; color: white; }
        .btn-pr { background: #334155; color: white; }
        .btn-clear { background: var(--danger); color: white; margin-top: 15px; width: 100%; padding: 12px; border-radius: 12px; font-size: 13px; }
        #preview-container { display: none; margin-top: 20px; zoom: 0.25; border: 1px solid #444; }
        #pdf-content { width: 210mm; height: 296.5mm; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nid-row { display: flex; flex-direction: row; align-items: center; justify-content: center; width: 100%; margin: 10mm 0; min-height: 60mm; }
        .nid-card { width: 90mm; height: auto; border: 0.5px solid #000; display: none; }
        .seal-side { width: 60mm; display: none; transform: rotate(-90deg); }
        @media print { .setup-box { display: none !important; } #preview-container { display: block !important; position: absolute; top: 0; left: 0; zoom: 1 !important; width: 210mm; } }
    </style>
</head>
<body>

    <div class="setup-box">
        <h2>NID Agent Tool</h2>
        <div id="qr-container"></div>
        <div id="connection-status">Initializing Secure Link...</div>
        
        <div class="input-group"><span class="upload-label">Front Side</span>
            <div class="file-wrapper" id="fWrap"><span class="placeholder-text" id="fLabel">Select or Scan</span><input type="file" id="fIn" accept="image/*"></div>
        </div>

        <div class="input-group"><span class="upload-label">Back Side</span>
            <div class="file-wrapper" id="bWrap"><span class="placeholder-text" id="bLabel">Select or Scan</span><input type="file" id="bIn" accept="image/*"></div>
        </div>

        <div class="input-group"><span class="upload-label">Agent Seal</span>
            <div style="display: flex; gap: 10px;">
                <div class="file-wrapper" style="flex: 3; height: 40px;"><span class="placeholder-text" id="sLabel" style="font-size: 11px;">Update Seal</span><input type="file" id="sIn" accept="image/*"></div>
                <button id="removeSeal" style="background: var(--danger); color: white; display: none; padding: 5px 10px; border-radius: 10px; font-size: 11px;" onclick="clearSeal()">Remove</button>
            </div>
        </div>
        
        <div class="btn-group"><button class="btn-dl" onclick="download()">Download PDF</button><button class="btn-pr" onclick="directPrint()">Print</button></div>
        <button class="btn-clear" onclick="triggerClear()">Clear Data</button>
    </div>

    <div id="preview-container"><div id="pdf-content">
        <div class="nid-row"><img id="fImg" class="nid-card"><img id="sImg1" class="seal-side"></div>
        <div class="nid-row"><img id="bImg" class="nid-card"><img id="sImg2" class="seal-side"></div>
    </div></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const shopId = params.get('id');

        // Professional ICE Config for GitHub (HTTPS)
        const peerConfig = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
                ],
                'iceCandidatePoolSize': 10
            },
            debug: 1
        };

        const peer = new Peer(undefined, peerConfig);
        let activeConn = null;

        peer.on('open', (id) => {
            if (!shopId) {
                const qrArea = document.getElementById('qr-container');
                qrArea.style.display = 'flex';
                const url = window.location.href.split('?')[0] + "?id=" + id;
                new QRCode(qrArea, { text: url, width: 120, height: 120 });
                updateStatus("System Ready - Scan QR", "var(--text-dim)");
                setupLocalUploads();
            } else { startMobileUI(shopId); }
        });

        peer.on('connection', (conn) => {
            activeConn = conn;
            updateStatus("Connected ✅", "var(--success)");
            conn.on('data', (data) => {
                if (data.action === 'clear') clearAllLocal();
                else processData(data.file, data.type === 'front' ? 'fImg' : 'bImg', data.type === 'front' ? 'fLabel' : 'bLabel', data.type === 'front' ? 'fWrap' : 'bWrap');
            });
        });

        function startMobileUI(targetId) {
            updateStatus("Connecting to PC...", "var(--primary)");
            const conn = peer.connect(targetId, { reliable: true });
            activeConn = conn;
            conn.on('open', () => {
                updateStatus("PC Linked ✅", "var(--success)");
                document.getElementById('fIn').onchange = (e) => send(e, 'front', 'fLabel', 'fWrap');
                document.getElementById('bIn').onchange = (e) => send(e, 'back', 'bLabel', 'bWrap');
            });
            conn.on('close', () => { updateStatus("Disconnected", "var(--danger)"); setTimeout(() => location.reload(), 2000); });
        }

        function processData(res, imgId, lblId, wrpId) {
            const img = document.getElementById(imgId); img.src = res; img.style.display = 'block';
            document.getElementById(lblId).innerText = "Done ✓"; document.getElementById(lblId).style.color = "white";
            document.getElementById(wrpId).style.backgroundColor = "var(--success)";
            document.getElementById('preview-container').style.display = 'block';
            updateSealVisibility();
        }

        function send(e, type, lblId, wrpId) {
            const file = e.target.files[0];
            if (file && activeConn) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    activeConn.send({ type: type, file: ev.target.result });
                    document.getElementById(lblId).innerText = "Sent ✓";
                    document.getElementById(wrpId).style.backgroundColor = "var(--success)";
                };
                reader.readAsDataURL(file);
            }
        }

        function setupLocalUploads() {
            document.getElementById('fIn').onchange = (e) => { const r = new FileReader(); r.onload = (ev) => processData(ev.target.result, 'fImg', 'fLabel', 'fWrap'); r.readAsDataURL(e.target.files[0]); };
            document.getElementById('bIn').onchange = (e) => { const r = new FileReader(); r.onload = (ev) => processData(ev.target.result, 'bImg', 'bLabel', 'bWrap'); r.readAsDataURL(e.target.files[0]); };
        }

        function triggerClear() { clearAllLocal(); if (activeConn) activeConn.send({ action: 'clear' }); }
        function clearAllLocal() { location.reload(); }
        function updateStatus(txt, col) { const el = document.getElementById('connection-status'); el.innerText = txt; el.style.color = col; }

        // Seal logic
        window.onload = () => updateSealVisibility();
        function updateSealVisibility() {
            const s = localStorage.getItem('agentSeal');
            if (s) {
                document.getElementById('sImg1').src = s; document.getElementById('sImg2').src = s;
                document.getElementById('removeSeal').style.display = 'block';
                document.getElementById('sImg1').style.display = document.getElementById('fImg').src.length > 50 ? 'block' : 'none';
                document.getElementById('sImg2').style.display = document.getElementById('bImg').src.length > 50 ? 'block' : 'none';
            }
        }
        function clearSeal() { localStorage.removeItem('agentSeal'); location.reload(); }
        document.getElementById('sIn').onchange = (e) => { const r = new FileReader(); r.onload = (ev) => { localStorage.setItem('agentSeal', ev.target.result); updateSealVisibility(); }; r.readAsDataURL(e.target.files[0]); };

        function download() { const e = document.getElementById('pdf-content'); html2pdf().set({ margin: 0, filename: 'NID_Print.pdf', html2canvas: { scale: 3 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(e).save(); }
        function directPrint() { window.print(); }
        peer.on('disconnected', () => peer.reconnect());
    </script>
</body>
</html>
